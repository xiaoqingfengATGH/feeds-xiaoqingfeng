worker_processes 1;
pid /tmp/homedirect-test/nginx.pid;
error_log /tmp/homedirect-test/error.log;
events { worker_connections 64; }
http {
access_log off;
client_body_temp_path /tmp/homedirect-test/body;
proxy_temp_path /tmp/homedirect-test/proxy;
ssl_certificate /tmp/homedirect-test/cert.pem;
ssl_certificate_key /tmp/homedirect-test/key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
server { listen 127.0.0.1:18443 ssl default_server; server_name _; return 444; }
server { listen 127.0.0.1:18443 ssl; server_name nas-stun-test.innonext.win; location / { proxy_pass http://127.0.0.1:18081; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_connect_timeout 5s; proxy_read_timeout 30s; } }
server { listen 127.0.0.1:18443 ssl; server_name files-stun-test.innonext.win; location / { proxy_pass http://127.0.0.1:18082; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_connect_timeout 5s; proxy_read_timeout 30s; } }
}
