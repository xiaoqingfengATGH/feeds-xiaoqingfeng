# Example strongSwan swanctl IKEv2 EAP-MSCHAPv2 connection.
# Place at /etc/swanctl/conf.d/ikev2-eap.conf and adapt to your network.
# EAP user secrets are managed separately by luci-app-ikev2-manager
# (it generates /etc/swanctl/conf.d/eap-users.conf).
connections {
    ikev2-eap {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256, aes256-sha256-modp2048, default
        rekey_time = 4h
        pools = ike-pool
        fragmentation = yes
        dpd_delay = 60s
        send_certreq = no
        local {
            auth = pubkey
            certs = ike-server.crt          # in /etc/swanctl/x509/, SAN = your DDNS
            id = vpn.example.com             # must equal the cert SAN
        }
        remote { auth = eap-mschapv2  eap_id = %any }
        children {
            ikev2-eap {
                local_ts = 192.168.1.0/24    # split tunnel: your LAN (0.0.0.0/0 for full)
                rekey_time = 1h
                dpd_action = clear
                esp_proposals = aes256gcm16, aes256-sha256, default
            }
        }
    }
}
pools { ike-pool { addrs = 10.9.0.0/24  dns = 192.168.1.1 } }
